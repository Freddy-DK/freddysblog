<script type="module">
  // GitHub Pages / Jekyll (kramdown) does not render ```mermaid fenced blocks,
  // so convert them client-side. Mermaid is only fetched when a diagram exists.
  if (document.querySelector('.language-mermaid')) {
    const { default: mermaid } = await import('https://cdn.jsdelivr.net/npm/mermaid@11/dist/mermaid.esm.min.mjs');
    document.querySelectorAll('.language-mermaid').forEach((el) => {
      const pre = document.createElement('pre');
      pre.className = 'mermaid';
      pre.textContent = el.textContent;
      el.replaceWith(pre);
    });
    mermaid.initialize({ startOnLoad: false });
    await mermaid.run();

    // Make each rendered diagram open full-screen in the lightbox, like images.
    document.querySelectorAll('.post-content pre.mermaid').forEach((pre) => {
      pre.style.cursor = 'zoom-in';
      pre.addEventListener('click', () => {
        const svg = pre.querySelector('svg');
        if (svg && window.openLightboxNode) {
          const clone = svg.cloneNode(true);
          clone.removeAttribute('style');
          // Size the clone to fit the viewport while preserving aspect ratio,
          // so the surrounding panel shrink-wraps the diagram.
          const vb = svg.viewBox.baseVal;
          if (vb && vb.width && vb.height) {
            const scale = Math.min(window.innerWidth * 0.9 / vb.width, window.innerHeight * 0.9 / vb.height);
            clone.setAttribute('width', vb.width * scale);
            clone.setAttribute('height', vb.height * scale);
          }
          window.openLightboxNode(clone);
        }
      });
    });
  }
</script>
